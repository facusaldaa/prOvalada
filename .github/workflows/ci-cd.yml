name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '18'

jobs:
  # Code Quality and Security Checks
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install basic development tools
          pip install black isort flake8 mypy bandit safety
          # Install project dependencies if requirements file exists
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Code formatting check (Black)
        run: |
          if [ -d "src" ] || [ -d "app" ] || find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | head -1 | grep -q .; then
            black --check --diff .
          else
            echo "No Python files found, skipping Black check"
          fi

      - name: Import sorting check (isort)
        run: |
          if [ -d "src" ] || [ -d "app" ] || find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | head -1 | grep -q .; then
            isort --check-only --diff .
          else
            echo "No Python files found, skipping isort check"
          fi

      - name: Linting (Flake8)
        run: |
          if [ -d "src" ] || [ -d "app" ] || find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | head -1 | grep -q .; then
            flake8 .
          else
            echo "No Python files found, skipping Flake8 check"
          fi

      - name: Type checking (MyPy)
        run: |
          if [ -d "src" ] || [ -d "app" ] || find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | head -1 | grep -q .; then
            mypy . --ignore-missing-imports || true
          else
            echo "No Python files found, skipping MyPy check"
          fi

      - name: Security scan (Bandit)
        run: |
          if [ -d "src" ] || [ -d "app" ] || find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | head -1 | grep -q .; then
            bandit -r . -f json -o bandit-report.json || true
          else
            echo "No Python files found, skipping Bandit scan"
          fi

      - name: Dependency security check (Safety)
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --json --output safety-report.json || true
          else
            echo "No requirements.txt found, skipping Safety check"
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 30

  # Testing
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run tests
        run: |
          if [ -d "tests" ] || find . -name "test_*.py" -not -path "./.venv/*" -not -path "./venv/*" | head -1 | grep -q .; then
            pytest --cov=. --cov-report=xml --cov-report=html --junitxml=pytest-results.xml
          else
            echo "No tests found, creating placeholder test result"
            mkdir -p test-results
            echo "No tests available yet" > test-results/placeholder.txt
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            htmlcov/
            test-results/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.9'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build package
        run: |
          if [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            python -m build
          else
            echo "No setup.py or pyproject.toml found, creating source distribution"
            mkdir -p dist
            tar -czf dist/provalada-source-$(date +%Y%m%d_%H%M%S).tar.gz --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' .
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          retention-days: 90

  # Docker Build (if Dockerfile exists)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deploy to staging
        id: deploy
        run: |
          echo "🚀 Deploying to staging environment"
          echo "This is where you would deploy to your staging environment"
          echo "Examples: kubectl, docker-compose, cloud provider CLI, etc."
          echo "url=https://staging.provalada.example.com" >> $GITHUB_OUTPUT

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deploy to production
        id: deploy
        run: |
          echo "🚀 Deploying to production environment"
          echo "This is where you would deploy to your production environment"
          echo "url=https://provalada.example.com" >> $GITHUB_OUTPUT

  # Notification
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result != 'skipped' || needs.deploy-production.result != 'skipped')
    steps:
      - name: Notify deployment result
        run: |
          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "✅ Staging deployment successful"
          fi
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Production deployment successful"
          fi
          echo "Add your notification logic here (Slack, Discord, Email, etc.)"